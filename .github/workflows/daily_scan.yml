name: Daily TW Stock Screener & Line Bot

on:
  schedule:
    # 盤中警報檢查：台灣時間 09:30 (UTC 01:30)、11:00 (UTC 03:00)、12:30 (UTC 04:30)
    - cron: '30 1 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '30 4 * * 1-5'
    # 盤後完整總結：台灣時間 17:00 (UTC 09:00)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run stock screener and push LINE Flex card
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python scanner_bot.py
